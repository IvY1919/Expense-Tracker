<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Expense</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/expense.css}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4>Expense Tracker</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link " href="/expense">
                        <i class="bi bi-wallet2"></i>
                        Expenses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-cash-stack"></i>
                        Income
                    </a>
                </li>

                <!-- <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bar-chart"></i>
                        Reports
                    </a>
                </li> -->

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>
            <hr>
                 <!-- <div class="theme-switch">
                    <button id="lightBtn" class="theme-btn active">
                        <i class="bi bi-brightness-high"></i> Light
                    </button>
                    <button id="darkBtn" class="theme-btn">
                        <i class="bi bi-moon"></i> Dark
                    </button>
                </div> -->
        </nav>

        <!-- Main Content -->
        <div class="main">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
                <div class="container-fluid position-relative">
                    <span class="brand">
                        Welcome, <span th:text="${username}"></span>
                    </span>                
                    <div class="current-date position-absolute top-50 start-50 translate-middle">
                        <h3 class="current_date mb-0" th:text="${#temporals.format(T(java.time.LocalDate).now(), 'dd MMMM, yyyy', T(java.util.Locale).ENGLISH)}">August, 2026</h3>
                    </div>
                    <!-- Right side -->
                    <form th:action="@{/logout}" method="post" class="ms-auto me-3">
                        <button type="submit" class="btn btn-outline-danger">
                        Logout
                        </button>
                    </form>
                </div>
            </nav>

            <!-- main container -->
            <div class="container-fluid mt-3">
                <div class="row g-3 justify-content-center">
                    <!-- Card 1 
                    <div class="col-md-4">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow">
                                <p>card1</p>
                            </div>
                        </div>
                    </div>-->

                    <!-- Table -->
                    <div class="col-md-12">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow">
                                <div class="row align-items-center">
                                    <div class="col ms-3 d-flex align-items-center">
                                        <button type = "button" class="month-arrow btn" th:onclick="'changeMonth(-1)'">
                                            <i class="bi bi-chevron-left"></i>
                                        </button>
                                        <div class="slect-month">
                                            <span th:text="${selectedMonth.month.name().substring(0,1)
                                                        + selectedMonth.month.name().substring(1).toLowerCase()
                                                        + ', ' + selectedMonth.year}">
                                                Augest, 2026
                                            </span>
                                        </div>
                                        <button type = "button" class="month-arrow btn"  th:onclick="'changeMonth(1)'">
                                            <i class="bi bi-chevron-right"></i>
                                        </button>
                                    </div>
                                    <div class="col-auto d-flex align-items-center me-4 current-month-total">
                                        <div class="income-label me-2">
                                            Total Income :
                                        </div>
                                        <div class="income-total" th:text="'¥' + ${#numbers.formatDecimal(monthlyincomeTotal, 0, 'COMMA', 0, 'POINT')}">
                                            ¥25,000
                                        </div>
                                    </div>
                                    <div class="col-auto">
                                        <button type = "button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addIncomeModal">
                                            + Add Income
                                        </button>
                                    </div>
                                </div>
                                <div class="table-container in-table">
                                    <table class="table income-table">
                                        <thead>
                                            <tr>
                                                <th>Income Date</th>
                                                <th>Description</th>
                                                <th>Amount</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="income : ${incomes}">
                                                <td th:text ="${income.incomeDate}"></td>
                                                <td th:text ="${income.description}"></td>
                                                <td th:text ="${income.incomeAmount}"></td>
                                                <td>
                                                    <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:attr="data-bs-target='#editIncomeModal-' + ${income.incomeId}">
                                                        Edit
                                                    </button>
                                                </td>
                                            </tr>
                                            <tr th:if="${#lists.isEmpty(incomes)}">
                                                <td colspan="5" class="text-center text-muted">No Incomes for this month.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            

                <!-- line graph -->
                <div class="card mt-3">
                    <div class="card-body card-body-shadow">
                        <div class="row align-tems-center">
                            <div class="col ms-3"><h5 class="income-month-graph-title">Incomes</h5></div>
                            <div class="col-auto graph-select-wrapper">
                                <select class="form-select graph-drop-down" onchange="location.href='/income?view='+this.value">
                                    <option value="monthly" th:selected="${view == 'monthly'}">
                                        Monthly
                                    </option>
                                    <option value="yearly" th:selected="${view == 'yearly'}">
                                        Yearly
                                    </option>
                                </select>
                            </div>
                        </div>
                                   
                        <div class="chart-container" style="height: 400px;">
                            <canvas id="incomeChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit modal -->
     <div th:each="income : ${incomes}" class="modal fade" 
          th:id="'editIncomeModal-' + ${income.incomeId}" tabindex="-1" aria-labelledby="editIncomeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editIncomeModalLabel">Edit Income</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <form th:action="@{/income/editincome}"  method="post">
                    <input type="hidden" name="incomeId" th:value="${income.incomeId}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="incomeDate" class="form-label"> Income Date </label>
                            <input type="date" name="incomeDate" class="form-control" id="IncomeDate" th:value="${income.incomeDate}">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label"> Description </label>
                            <input type="text" name="description" class="form-control" id="incomedescription" th:value="${income.description}">
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label"> Amount </label>
                            <input type="number" name="incomeAmount" class="form-control" id="incomeanoumt" th:value="${income.incomeAmount}">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" th:attr="data-bs-target='#deleteConfirmModal-' + ${income.incomeId}">
                            Delete
                        </button>
                        <div class="ms-auto">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancel
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
     </div>

     <!-- DElete Confirmation modal -->
    <div th:each="income : ${incomes}" class="modal fade"
        th:id="'deleteConfirmModal-' + ${income.incomeId}"
        tabindex="-1"
        aria-labelledby="deleteConfirmModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <!-- Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel"> Delete Expense </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <!-- Body -->
                <form th:action="@{/income/deleteincome}" method="post">
                    <input type="hidden"  name="incomeId" th:value="${income.incomeId}">
                    <div class="modal-body">
                        <p class="mb-0"> Are you sure you want to delete this expense? </p>
                    </div>
                    <!-- Footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-danger">
                            Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add income modal -->
     <div class="modal fade" tabindex="-1" id="addIncomeModal" aria-labelledby="editIncomeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editIncomeModalLabel">Add Income</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <form th:action="@{/income/addincome}" method="post">
                    <input type="hidden" name="expId" >
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="incomeDate" class="form-label"> Income Date </label>
                            <input type="date" name="incomeDate" class="form-control" id="IncomeDate" >
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label"> Description </label>
                            <input type="text" name="description" class="form-control" id="incomedescription" >
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label"> Amount </label>
                            <input type="number" name="incomeAmount" class="form-control" id="incomeanoumt" >
                        </div>
                    </div>
                    <div class="modal-footer">
                        <div class="ms-auto">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancel
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
     </div>

<script>
    function changeMonth(direction){
        const currentMonth = '[[${selectedMonth}]]';
        let date = new Date(currentMonth + '-01');
        date.setMonth(date.getMonth() + direction);

        const year = date.getFullYear();
        const month = String(date.getMonth()+1).padStart(2,'0');
        window.location.href = `/income?month=${year}-${month}`;
    }
</script>

<script th:inline="javascript">
    const ctx = document.getElementById("incomeChart");
    const monthlyTotals = /*[[${monthlyTotals}]]*/[];
    const yearlyTotals = /*[[${yearlyTotals}]]*/[];
    const view = /*[[${view}]]*/'monthly';
    const currentYear = /*[[${year}]]*/ 2026;

    let labels = [];
    let data = [];

    if (view === 'monthly'){
        labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Nov','Dec'];
        data = monthlyTotals.map(value => Number(value));
    }else{
        labels = [];
        for(let i = -4; i <= 2; i++){
            labels.push(currentYear + i);
        }
        data = yearlyTotals.map(value => Number(value));
    }

    new Chart(ctx, {
        type : 'line',
        data : {
            labels : labels,
            datasets : [{
                label : view === 'monthly' ? 'Monthly Expenses': 'Yearly Expenses',
                data : data,
                borderWidth : 2,
                borderColor: '#4f46e5',
                tension: 0.3
            }]
        },
        options : {
            responsive : true,
            maintainAspectRatio: false,
                animation: {
                    duration: 2000,
                    easing: 'easeInOutQuart'
                },
                scales: {
                    y: { beginAtZero: true }
                }
        }
    });

</script>

</body>
</html>
