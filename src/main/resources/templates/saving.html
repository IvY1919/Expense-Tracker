<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Expense Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="wrapper">

        <!-- Backdrop for mobile sidebar (click to close) -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4>Expense Tracker</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/expense">
                        <i class="bi bi-wallet2"></i>
                        Expenses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/income">
                        <i class="bi bi-cash-stack"></i>
                        Income
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/alltransactions">
                        <i class="bi bi-arrow-left-right"></i>
                        Transactions
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/saving">
                        <i class="bi bi-bar-chart-fill"></i>
                        Saving Simulation
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/account_setting">
                        <i class="bi bi-gear"></i>
                        Account Settings
                    </a>
                </li>
            </ul>
            <hr>
            <div class="theme-switch">
                <button id="lightBtn" class="theme-btn">
                    <i class="bi bi-brightness-high"></i> Light
                </button>
                <button id="darkBtn" class="theme-btn active">
                    <i class="bi bi-moon"></i> Dark
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg shadow-sm main-navbar">
                <div class="container-fluid position-relative">
                    <!-- Hamburger (mobile / tablet only) -->
                    <button type="button" class="sidebar-toggle" id="sidebarToggle"
                            aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="brand">
                        Welcome, <span th:text="${username}"></span>
                    </span>                
                    <div class="current-date position-absolute top-50 start-50 translate-middle">
                        <h3 class="current_date mb-0" th:text="${#temporals.format(T(java.time.LocalDate).now(), 'dd MMMM, yyyy', T(java.util.Locale).ENGLISH)}">August, 2026</h3>
                    </div>
                    <form th:action="@{/logout}" method="post" class="ms-auto me-3">
                        <button type="submit" class="btn btn-outline-danger">
                        Logout
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Page Content -->

            
        </div>


    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/DarkLightMode.js}"></script>
</body>
</html>
