<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Expense Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="wrapper">

        <!-- Backdrop for mobile sidebar (click to close) -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4>Expense Tracker</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/expense">
                        <i class="bi bi-wallet2"></i>
                        Expenses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/income">
                        <i class="bi bi-cash-stack"></i>
                        Income
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/alltransactions">
                        <i class="bi bi-arrow-left-right"></i>
                        Transactions
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/account_setting">
                        <i class="bi bi-gear"></i>
                        Account Settings
                    </a>
                </li>
            </ul>
            <hr>
            <div class="theme-switch">
                <button id="lightBtn" class="theme-btn">
                    <i class="bi bi-brightness-high"></i> Light
                </button>
                <button id="darkBtn" class="theme-btn active">
                    <i class="bi bi-moon"></i> Dark
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg shadow-sm main-navbar">
                <div class="container-fluid position-relative">
                    <!-- Hamburger (mobile / tablet only) -->
                    <button type="button" class="sidebar-toggle" id="sidebarToggle"
                            aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="brand">
                        Welcome, <span th:text="${username}"></span>
                    </span>                
                    <div class="current-date position-absolute top-50 start-50 translate-middle">
                        <h3 class="current_date mb-0" th:text="${#temporals.format(T(java.time.LocalDate).now(), 'dd MMMM, yyyy', T(java.util.Locale).ENGLISH)}">August, 2026</h3>
                    </div>
                    <form th:action="@{/logout}" method="post" class="ms-auto me-3">
                        <button type="submit" class="btn btn-outline-danger">
                        Logout
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Page Content -->

            <div class="card ms-3 mt-3">
                <div class="card-body card-body-shadow d-flex flex-column">
                    <div class="row align-items-center">
                        <div class="table-container all-trans-table">
                            <form th:action="@{/alltransactions}" method="get" class="d-flex align-items-center justify-content-between mb-4 gap-3 flex-wrap">
                                <h4 class="mb-4">All Transactions</h4>

                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <!-- Year filter -->
                                    <div class="d-flex align-items-center gap-2 ">
                                        <label for="yearFilter" class="form-label mb-0">Year</label>
                                        <select name="yearFilter" id="yearFilter" class="form-select" onchange="this.form.requestSubmit()">
                                            <option value="All" th:selected="${selectedYear == 'All'}">All</option>
                                            <option th:each="y : ${availableYears}" 
                                                th:value="${y}" 
                                                th:text="${y}" 
                                                th:selected="${selectedYear == y.toString()}"></option>
                                        </select>
                                    </div>

                                    <!-- Type filter -->
                                    <div class="d-flex align-items-center gap-2">
                                        <label for="typeFilter" class="form-label mb-0">Type</label>
                                        <select name="typeFilter" id="typeFilter" class="form-select" onchange="this.form.requestSubmit()">
                                            <option value="All" th:selected="${selectedType == 'All'}">All</option>
                                            <option value="Income" th:selected="${selectedType == 'Income'}">Income</option>
                                            <option value="Expense" th:selected="${selectedType == 'Expense'}">Expense</option>
                                        </select>
                                    </div>

                                    <!-- Apply filter
                                    <div>
                                        <button type="submit" class="btn btn-sm btn-outline-primary">Apply</button>
                                    </div> 
                                    -->

                                    <!-- Export filtered results -->
                                    <div>
                                        <button type="submit" class="btn btn-success" th:formaction="@{/alltransactions/export}">
                                            <i class="bi bi-file-earmark-excel"></i> Export Excel
                                        </button>
                                    </div>
                                </div>
                            </form>
                            <table class="table alltrans-table">
                                <thead>
                                    <tr>
                                        <th>Description</th>
                                        <th>Date</th>                                        
                                        <th>Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="transaction : ${allTransactions}">
                                        <td th:text = "${transaction.description}"></td>
                                        <td th:text = "${transaction.date}"></td>
                                        <td>
                                            <span th:if="${transaction.type == 'Income'}"
                                                class="text-success"
                                                th:text="'+' + ${transaction.amount}"></span>
                                            <span th:if="${transaction.type == 'Expense'}"
                                                class="text-danger"
                                                th:text="'-' + ${transaction.amount}"></span>
                                            </td>
                                        </tr>
                                </tbody>
                            </table>
                            <div class="pagination-container mt-4" th:if="${totalPages >1}" aria-label="Transaction pagination">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" th:href="@{/alltransactions(page=${currentPage -1},
                                                                                    yearFilter=${selectedYear},
                                                                                    typeFilter=${selectedType})}">
                                            <i class="bi bi-caret-left-fill"></i>
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:classappend="${pageNumber == currentPage} ? 'active'">
                                            <a class="page-link" th:href="@{/alltransactions(page=${pageNumber},
                                                                                            yearFilter=${selectedYear},
                                                                                            typeFilter=${selectedType})}" th:text="${pageNumber + 1}">
                                            </a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage == totalPages -1} ? 'disabled'">
                                        <a class="page-link" th:href="@{/alltransactions(page=${currentPage +1},
                                                                            yearFilter=${selectedYear},
                                                                            typeFilter=${selectedType})}">
                                            <i class="bi bi-caret-right-fill"></i>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>              
                </div>
            </div>
        </div>


    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/DarkLightMode.js}"></script>
    <!-- Mobile sidebar toggle -->
    <script>
        (function () {
            const toggleBtn = document.getElementById("sidebarToggle");
            const backdrop = document.getElementById("sidebarBackdrop");
            const sidebar = document.getElementById("sidebar");
            if (!toggleBtn || !backdrop || !sidebar) { return; }

            function setSidebar(open) {
                document.body.classList.toggle("sidebar-open", open);
                toggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
            }

            toggleBtn.addEventListener("click", function () {
                setSidebar(!document.body.classList.contains("sidebar-open"));
            });
            backdrop.addEventListener("click", function () { setSidebar(false); });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") { setSidebar(false); }
            });
            // Reset when resizing up to desktop layout
            window.matchMedia("(min-width: 992px)").addEventListener("change", function (e) {
                if (e.matches) { setSidebar(false); }
            });
        })();
    </script>

</body>
</html>
