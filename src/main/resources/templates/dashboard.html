<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Expense Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4>Expense Tracker</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/expense">
                        <i class="bi bi-wallet2"></i>
                        Expenses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/income">
                        <i class="bi bi-cash-stack"></i>
                        Income
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/alltransactions">
                        <i class="bi bi-arrow-left-right"></i>
                        Transactions
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>
            <hr>
            <div class="theme-switch">
                <button id="lightBtn" class="theme-btn active">
                    <i class="bi bi-brightness-high"></i> Light
                </button>
                <button id="darkBtn" class="theme-btn">
                    <i class="bi bi-moon"></i> Dark
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg shadow-sm main-navbar">
                <div class="container-fluid position-relative">
                    <span class="brand">
                        Welcome, <span th:text="${username}"></span>
                    </span>                
                    <div class="current-date position-absolute top-50 start-50 translate-middle">
                        <h3 class="current_date mb-0" th:text="${#temporals.format(T(java.time.LocalDate).now(), 'dd MMMM, yyyy', T(java.util.Locale).ENGLISH)}">August, 2026</h3>
                    </div>
                    <form th:action="@{/logout}" method="post" class="ms-auto me-3">
                        <button type="submit" class="btn btn-outline-danger">
                        Logout
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="container-fluid mt-3">
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow" style="color: #e80a0a;">
                                <h5><i class="bi bi-calendar-plus"></i> Total Expense</h5>
                                <div class="d-flex align-items-baseline gap-2">
                                    <h2>- ¥<span th:text="${#numbers.formatDecimal(monthlyexpenseTotal, 0, 'COMMA', 0, 'POINT')}"></h2>
                                    <p class="mb-0">/<span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'MMMM', T(java.util.Locale).ENGLISH)}"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow"  style="color: #06bd03;">
                                <h5><i class="bi bi-calendar-minus"></i> Total Income</h5>
                                <div class="d-flex align-items-baseline gap-2">
                                    <h2>+ ¥<span th:text="${#numbers.formatDecimal(monthlyincomeTotal,0, 'COMMA', 0, 'POINT')}"></h2>
                                    <p class="mb-0">/<span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'MMMM', T(java.util.Locale).ENGLISH)}"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow"   style="color: #6c63ff">
                                <h5><i class="bi bi-calendar-month"></i>
                                Balance Remaining</h5>
                                <div class="d-flex align-items-baseline gap-2">
                                    <h2>¥<span th:text="${#numbers.formatDecimal(monthlyRemainingTotal,0, 'COMMA', 0, 'POINT')}"></h2>
                                    <p class="mb-0">/<span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'MMMM', T(java.util.Locale).ENGLISH)}"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card h-100">
                            <div class="card-body card-body-shadow"   style="color: #d2ca37;">
                                <h5><i class="bi bi-coin"></i>
                                Total Saving</h5>
                                <h2>¥56,500</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-12 col-lg-4">
                        <div class="card h-100 dashboard-card">
                            <div class="card-body card-body-shadow">
                                <div class="table-container trans-table">
                                    <h4>Latest Transactions</h4>
                                    <!-- <a href="/alltransactions">View All Transactions</a> -->
                                    <table class="table latestrans-table">
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Description</th>
                                                <th>Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="transaction : ${latestTransactions}">
                                                <td th:text = "${transaction.description}"></td>
                                                <td th:text = "${transaction.date}"></td>
                                                <td>
                                                <span th:if="${transaction.type == 'Income'}"
                                                    class="text-success"
                                                    th:text="'+' + ${transaction.amount}">
                                                </span>
                                                <span th:if="${transaction.type == 'Expense'}"
                                                    class="text-danger"
                                                    th:text="'-' + ${transaction.amount}">
                                                </span>
                                            </td>
                                            </tr>
                                            <tr th:if="${#lists.isEmpty(latestTransactions)}">
                                                <td colspan="3" class="text-center text-muted">No recent transactions.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>   
                    <div class="col-12 col-lg-8">
                        <div class="card h-100 dashboard-card" >
                            <div class="card-body card-body-shadow">
                                card1
                            </div>
                        </div>
                    </div>              
                    
                </div>
            
                <!-- Bar Chart -->            
                <div class="card mt-3">
                    <div class="card-body card-body-shadow">
                        <div class="row align-items-center mb-3">                  
                            <div class="col ms-3">
                                <h5 class = "card-title mb-1">Income & Expense</h5>
                            </div>
                            <div class="col-auto graph-select-wrapper">
                                <select class="form-select form-select-sm" id="yearSelect" onchange="selectYear(this.value)"></select>
                            </div>
                        </div>

                        <div class="barchart-scroll">
                            <div class="barchart-container">
                                <canvas id="incomeExpenseBarChart"></canvas>
                            </div>
                        </div>                    
                    </div>
                </div>
            </div>                
        </div>


    </div>

    <!-- JavaScript -->
    <script th:src="@{/js/theme.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        
        const yearSelect = document.getElementById('yearSelect');
        const currentYear = new Date().getFullYear();
        const selectedYear = /*[[${selectedYear}]]*/currentYear;
        const expenseMonthlyTotals = /*[[${expenseMonthlyTotals}]]*/ [];
        const incomeMonthlyTotals = /*[[${incomeMonthlyTotals}]]*/ []; 
        let incomeData = incomeMonthlyTotals.map(value => Number(value));
        let expenseData = expenseMonthlyTotals.map(value => Number(value));
        let incomeExpenseChart = null;


        function getChartThemeColors() { 
            const styles = getComputedStyle(document.documentElement); 
            return { textColor: styles .getPropertyValue("--chart-text-color") .trim(), 
                     gridColor: styles .getPropertyValue("--chart-grid-color") .trim() 
                    }; 
        }

        function createBarChart() {
            const ctx = document.getElementById('incomeExpenseBarChart');
            const colors = getChartThemeColors();
            incomeExpenseChart = new Chart( ctx, {
                type: 'bar',
                data: {
                    labels: [
                        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun','Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'  
                    ],
                    datasets: [
                        {
                            label: 'Income',
                            data: incomeData,
                            borderWidth: 1.5,
                            backgroundColor: '#e80a0ab5',
                            borderColor: '#e80a0a'
                        },
                        {
                            label: 'Expense',
                            data: expenseData,
                            borderWidth: 1.5,
                            backgroundColor: '#06bd03ab',
                            borderColor: '#06bd03'
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: {
                        x: { ticks:{color : colors.textColor},
                             grid: {color : colors.gridColor}
                        },
                        y: {
                            beginAtZero: true,

                            ticks: {
                                callback: function(value) { return '¥' + value.toLocaleString();},
                                color: colors.textColor
                            },
                            grid: {color : colors.gridColor}
                        }
                    },

                    plugins: {
                        legend: { position: 'bottom',
                                  labels : { color: colors.textColor}
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ¥' +
                                        context.raw.toLocaleString();
                                }
                            }
                        }
                    }
                }

            });

        }

        for( let year = currentYear + 10; year >= currentYear-50; year--)
        {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;

            if(year === selectedYear){
                option.selected = true;
            }
            yearSelect.appendChild(option);
        }

        function selectYear(year){
            window.location.href = `/dashboard?year=${year}`;

        }

        const lightBtn = document.getElementById("lightBtn");
        const darkBtn = document.getElementById("darkBtn");
        const savedTheme = localStorage.getItem("theme");
        
        function updateThemeButtons() {
            if (document.documentElement.classList.contains("dark-mode")) {
                darkBtn.classList.add("active");
                lightBtn.classList.remove("active");
            } else {
                lightBtn.classList.add("active");
                darkBtn.classList.remove("active");
            }
        }

        lightBtn.addEventListener("click", () => {
            localStorage.setItem("theme", "light");
            location.reload();
        });

        darkBtn.addEventListener("click", () => {
            localStorage.setItem("theme", "dark");
            location.reload();
        });

        if(savedTheme ==="dark"){
            document.documentElement.classList.add("dark-mode");
        }else{
            document.documentElement.classList.remove("dark-mode");
        }

        // 7. Initialize everything 
        createBarChart(); 
        updateThemeButtons();

    </script>
</body>
</html>
