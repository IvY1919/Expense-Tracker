<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Expense Tracker</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="wrapper">

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4>Expense Tracker</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/expense">
                        <i class="bi bi-wallet2"></i>
                        Expenses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-cash-stack"></i>
                        Income
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bar-chart"></i>
                        Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>
                 <!-- <div class="theme-switch">
                    <button id="lightBtn" class="theme-btn active">
                        <i class="bi bi-brightness-high"></i> Light
                    </button>
                    <button id="darkBtn" class="theme-btn">
                        <i class="bi bi-moon"></i> Dark
                    </button>
                </div> -->
        </nav>

        <!-- Main Content -->
        <div class="main">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
                <div class="container-fluid">
                    <span class="brand">
                        Welcome, <span th:text="${username}"></span>
                    </span>
                </div>
                <!-- Right side -->
                <form th:action="@{/logout}" method="post" class="ms-auto me-3">
                    <button type="submit" class="btn btn-outline-danger">
                    Logout
                    </button>
                </form>
            </nav>

            <!-- Page Content -->
            <div class="container-fluid mt-3">
                <div class="row justify-content-center">
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body card-body-shadow" style="color: #e87d0a;">
                                <h5><i class="bi bi-calendar-plus"></i>
                                Total Expense</h5>
                                <h2>¥<span th:text="${#numbers.formatDecimal(monthlyTotal, 0, 'COMMA', 0, 'POINT')}"></h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body card-body-shadow"  style="color: #06ed02;">
                                <h5><i class="bi bi-calendar-minus"></i>
                                Total Income</h5>
                                <h2>¥80,000</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body card-body-shadow"   style="color: #2c40f5;">
                                <h5><i class="bi bi-calendar-month"></i>
                                Balance Remaining</h5>
                                <h2>¥56,500</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body card-body-shadow"   style="color: #d2ca37;">
                                <h5><i class="bi bi-coin"></i>
                                Total Balance</h5>
                                <h2>¥56,500</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script th:src="@{/js/theme.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
