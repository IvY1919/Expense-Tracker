<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-card">
    <form th:action="@{/login}" method="post">
        <div class="row g-0">
            <div class="col-lg-6 col-md-6">
                <div class="login-image">
                    <img th:src="@{/gallary/login.jpg}" alt="Fleurs et jardin" class="img-fluid">
                </div>
            </div>

            <!-- login form -->
            <div class="col-lg-6 col-md-6">
                <div class="login-form">
                    <div class="title-decor">
                        <h2>Expense Tracker</h2>
                    </div>
                    <p class="sub-text">
                        Welcome Back!
                    </p> 
                    
                    <!-- username / email -->
                    <div class="mb-2">
                        <label for="emailInput" class="form-label">Email</label>
                        <div th:if="${param.emailNotFound}" class="text-danger mt-1"> Email not registered.</div>
                        <div th:if="${param.loginError}" class="text-danger mt-1"> Incorrect email or password.</div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="email" class="form-control" name="email" id="emailInput" placeholder="your-email@gmail.com" required>
                        </div>
                    </div>
                    <!-- password -->
                    <div>
                        <label for="passwordInput" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" id="passwordInput" placeholder="Your Password" required>
                        </div>
                    </div>

                    <!-- remember & forgot row -->
                    <div class="forgot-row mt-2">
                        <!-- <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberCheck" checked>
                            <label class="form-check-label" for="rememberCheck">
                            Remember me
                            </label>
                        </div> -->
                        <a th:href="@{/forgetPwd}" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- login button -->
                    <button class="btn btn-login mt-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>

                    <hr>
                    <div class="signup-text">
                    Don't have an account? <a th:href="@{/signup}">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
